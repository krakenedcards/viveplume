name: Publication de la liseuse
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: viveplume-pages
  cancel-in-progress: false

permissions: {}

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python3 outils/verifier.py
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer la liseuse
        id: deploiement
        uses: actions/deploy-pages@v4
